media:
  input: public/images
  output: /images

content:
  - name: reviews
    label: Reviews
    type: collection
    path: src/content/reviews
    format: yaml-frontmatter
    filename: "{fields.slug}.md"
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: director
        label: Director
        type: string
        required: true
      - name: year
        label: Release Year
        type: number
        required: true
      - name: slug
        label: Slug
        type: string
        required: true
      - name: date
        label: Publication Date
        type: date
        required: true
      - name: rating
        label: Rating (out of 5)
        type: number
      - name: summary
        label: Short Summary (optional)
        type: text
      - name: body
        label: Review Text
        type: rich-text
        description: "Write only your review here. The title, director, date and rating are displayed separately above it."

  - name: homepage
    label: Homepage
    type: file
    path: src/content/pages/home.md
    format: yaml-frontmatter
    fields:
      - name: slug
        label: Internal Page ID
        type: string
        readonly: true
      - name: title
        label: Browser Tab Title
        type: string
      - name: eyebrow
        label: Small Heading
        type: string
      - name: headline
        label: Main Heading
        type: string
      - name: intro
        label: Introductory Text
        type: text
      - name: body
        label: Extra Homepage Text
        type: rich-text
      - name: sectionHeading
        label: Reviews Section Heading
        type: string
        description: "The heading above the reviews, normally Recent writing."
      - name: closingNote
        label: Closing Note
        type: text
        description: "The sentence below the reviews."

  - name: about_page
    label: About Page
    type: file
    path: src/content/pages/about.md
    format: yaml-frontmatter
    fields:
      - name: slug
        label: Internal Page ID
        type: string
        readonly: true
      - name: title
        label: Browser Tab Title
        type: string
      - name: eyebrow
        label: Small Heading
        type: string
      - name: headline
        label: Main Heading
        type: string
      - name: intro
        label: Introductory Text
        type: text
      - name: body
        label: Main About Text
        type: rich-text
