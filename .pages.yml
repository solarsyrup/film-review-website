media:
  - name: images
    label: Images
    input: public/images
    output: /images
  - name: portfolio_files
    label: Portfolio files
    input: public/uploads
    output: /uploads
    categories: [audio, video, document]

content:
  - name: reviews
    label: Reviews
    type: collection
    path: src/content/reviews
    format: yaml-frontmatter
    filename: "{fields.slug}.md"
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: director
        label: Director / Creator (optional for TV and other media)
        type: string
      - name: year
        label: Release Year
        type: number
        required: true
      - name: slug
        label: Slug
        type: string
        required: true
      - name: date
        label: Publication Date
        type: date
        required: true
      - name: rating
        label: Rating (out of 5)
        type: number
      - name: medium
        label: Medium (optional)
        type: select
        options:
          values: [Film, TV, Music, Game, Book, Other]
      - name: cover
        label: Poster / Cover (optional, auto-filled for Film and TV)
        type: image
        options:
          media: images
          rename: safe
      - name: tmdbId
        label: TMDB ID (optional, for matching the right poster)
        type: number
        description: "Only needed when multiple movies/shows have the same name. Find the numeric ID in the TMDB page URL."
      - name: autoPoster
        label: Automatically find a poster
        type: boolean
        default: true
        description: "Requires the GitHub TMDB_API_TOKEN secret. To override an automatic poster, upload your own cover."
      - name: summary
        label: Short Summary (optional)
        type: text
      - name: body
        label: Review Text
        type: rich-text
        description: "Write only your review here. The title, director, date and rating are displayed separately above it."
      - name: spoilerHeading
        label: Spoiler Button Text (optional)
        type: string
        description: "For example, Spoilers for the ending. Only shown if Spoiler Text is filled in."
      - name: spoilerText
        label: Hidden Spoiler Section (optional)
        type: text
        description: "Any text here is hidden behind a click-to-reveal spoiler button."

  - name: homepage
    label: Homepage
    type: file
    path: src/content/pages/home.md
    format: yaml-frontmatter
    fields:
      - name: slug
        label: Internal Page ID
        type: string
        readonly: true
      - name: title
        label: Browser Tab Title
        type: string
      - name: eyebrow
        label: Small Heading
        type: string
      - name: headline
        label: Main Heading
        type: string
      - name: intro
        label: Introductory Text
        type: text
      - name: body
        label: Extra Homepage Text
        type: rich-text
      - name: sectionHeading
        label: Reviews Section Heading
        type: string
        description: "The heading above the reviews, normally Recent writing."
      - name: closingNote
        label: Closing Note
        type: text
        description: "The sentence below the reviews."
      - name: currentlyWatching
        label: Currently Watching (optional)
        type: string
      - name: currentlyReading
        label: Currently Reading (optional)
        type: string
      - name: currentlyListening
        label: Currently Listening (optional)
        type: string
      - name: currentlyPlaying
        label: Currently Playing (optional)
        type: string
      - name: currentlyWatchingCover
        label: Currently Watching - Poster (optional)
        type: image
        description: "Upload a movie or television poster to display next to what you're watching."
        options:
          media: images
          rename: safe
      - name: currentlyReadingCover
        label: Currently Reading - Cover (optional)
        type: image
        options:
          media: images
          rename: safe
      - name: currentlyListeningCover
        label: Currently Listening - Album Artwork (optional)
        type: image
        options:
          media: images
          rename: safe
      - name: currentlyPlayingCover
        label: Currently Playing - Game Artwork (optional)
        type: image
        options:
          media: images
          rename: safe
      - name: currentlyWatchingType
        label: Watching - Type
        type: select
        default: TV
        options:
          values: [TV, Film]
      - name: currentlyWatchingYear
        label: Watching - Original Release Year (optional)
        type: number
        description: "Helps match shows and movies with similar names."
      - name: currentlyReadingAuthor
        label: Reading - Author (optional)
        type: string
        description: "Helps match books, manga, and comics."
      - name: currentlyReadingVolume
        label: Reading - Volume Number (optional)
        type: number
        description: "For manga or graphic novels. Leave blank to prefer the first volume or the series cover. Specify a number to require that exact volume."
      - name: currentlyReadingISBN
        label: Reading - ISBN (optional)
        type: string
        description: "Use the ISBN of a particular edition if its cover isn't found by title. Leave blank normally."
      - name: currentlyListeningArtist
        label: Listening - Music Artist (optional)
        type: string
        description: "Helps identify the correct album or EP."
      - name: currentlyPlayingYear
        label: Playing - Release Year (optional)
        type: number
      - name: currentlyWatchingAutoArtwork
        label: Watching - Automatically Find Artwork
        type: boolean
        default: true
      - name: currentlyReadingAutoArtwork
        label: Reading - Automatically Find Artwork
        type: boolean
        default: true
      - name: currentlyListeningAutoArtwork
        label: Listening - Automatically Find Artwork
        type: boolean
        default: true
      - name: currentlyPlayingAutoArtwork
        label: Playing - Automatically Find Artwork
        type: boolean
        default: true

  - name: about_page
    label: About Page
    type: file
    path: src/content/pages/about.md
    format: yaml-frontmatter
    fields:
      - name: slug
        label: Internal Page ID
        type: string
        readonly: true
      - name: title
        label: Browser Tab Title
        type: string
      - name: eyebrow
        label: Small Heading
        type: string
      - name: headline
        label: Main Heading
        type: string
      - name: intro
        label: Introductory Text
        type: text
      - name: body
        label: Main About Text
        type: rich-text
  
  - name: portfolio_projects
    label: Portfolio Projects
    type: collection
    path: src/content/projects
    format: yaml-frontmatter
    filename: "{fields.slug}.md"
    view:
      fields: [title, category, year, date]
      primary: title
      sort: [date, title]
      default:
        sort: date
        order: desc
    fields:
      - name: title
        label: Project Title
        type: string
        required: true
      - name: slug
        label: URL Slug (lowercase-with-dashes)
        type: string
        required: true
        pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
      - name: category
        label: Type of Work
        type: select
        required: true
        options:
          values: [Film, Writing, Photography, Music, Other]
      - name: year
        label: Year Created (optional)
        type: number
      - name: date
        label: Date Added (optional, newest first)
        type: date
      - name: role
        label: Your Role (optional)
        type: string
        description: "For example, Director, Photographer, Writer, Composer."
      - name: description
        label: Short Description
        type: text
        description: "This appears on the portfolio gallery and above the work."
      - name: cover
        label: Cover Image (optional)
        type: image
        options:
          media: images
          rename: safe
      - name: coverAlt
        label: Cover Image Description (optional)
        type: string
      - name: gallery
        label: Photo Gallery (optional)
        type: image
        options:
          media: images
          multiple:
            max: 24
          rename: safe
      - name: mediaFile
        label: Upload Audio, Video, or a Document (optional)
        type: file
        description: "Small MP3/MP4/PDF files. For large videos or albums, use the link field instead."
        options:
          media: portfolio_files
          categories: [audio, video, document]
          rename: safe
      - name: link
        label: Project Link (auto-embeds when supported)
        type: string
        description: "Paste a public YouTube, Vimeo, SoundCloud, Spotify, or Google Drive link for automatic inline playback or preview. Any other URL remains a normal link."
      - name: embedLink
        label: Optional Embed Player URL or Bandcamp Embed Code
        type: text
        description: "Usually leave blank. For Bandcamp, open Share / Embed and paste the full iframe embed code (or its src URL) here. You can also use this to override the player shown for other services."
      - name: body
        label: Project Story or Writing
        type: rich-text
        description: "Add your writing, process notes, credits, or context. This appears on the individual project page."
        options:
          media: images

  - name: portfolio_page
    label: Portfolio Page
    type: file
    path: src/content/pages/portfolio.md
    format: yaml-frontmatter
    fields:
      - name: slug
        label: Internal Page ID
        type: string
        readonly: true
      - name: title
        label: Browser Tab Title
        type: string
      - name: eyebrow
        label: Small Heading
        type: string
      - name: headline
        label: Main Heading
        type: string
      - name: intro
        label: Introductory Text
        type: text
      - name: body
        label: Extra Portfolio Introduction
        type: rich-text
        options:
          media: images

  - name: diary
    label: The Diary
    type: collection
    path: src/content/diary
    format: yaml-frontmatter
    filename: "{fields.slug}.md"
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: slug
        label: URL Slug (lowercase-with-dashes)
        type: string
        required: true
        pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
      - name: medium
        label: Medium
        type: select
        required: true
        options:
          values: [Film, TV, Music, Game, Book, Other]
      - name: date
        label: Date Experienced
        type: date
        required: true
      - name: year
        label: Release Year (optional)
        type: number
      - name: creator
        label: Director, Artist, or Author (optional)
        type: string
      - name: rating
        label: Rating out of 5 (optional)
        type: number
      - name: cover
        label: Cover or Poster (optional)
        type: image
        options:
          media: images
          rename: safe
      - name: note
        label: Brief Thoughts
        type: text
      - name: tmdbId
        label: TMDB ID (optional)
        type: number
        description: "Helps identify the correct movie or TV show when titles overlap."
      - name: autoPoster
        label: Automatically find a poster
        type: boolean
        default: true
      - name: reviewUrl
        label: Full Review Link (optional)
        type: string
        description: "Use a site path like /reviews/clayface-review/ — leave blank if there's no full review."
