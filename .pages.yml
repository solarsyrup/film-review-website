media:
  input: public/images
  output: /images

content:
  - name: reviews
    label: Reviews
    type: collection
    path: src/content/reviews
    format: yaml-frontmatter
    filename: "{fields.slug}.md"
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: director
        label: Director
        type: string
        required: true
      - name: year
        label: Release Year
        type: number
        required: true
      - name: slug
        label: Slug
        type: string
        required: true
      - name: date
        label: Publication Date
        type: date
        required: true
      - name: rating
        label: Rating (out of 5)
        type: number
      - name: summary
        label: Short Summary (optional)
        type: text
      - name: body
        label: Review Text
        type: rich-text
        description: "Write only your review here. The title, director, date and rating are displayed separately above it."
