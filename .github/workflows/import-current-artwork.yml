name: Automatically import current media artwork

on:
  push:
    branches: [main]
    paths:
      - "src/content/pages/home.md"
      - "scripts/import_current_artwork.py"
      - ".github/workflows/import-current-artwork.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: current-artwork-main
  cancel-in-progress: false

jobs:
  import-current-artwork:
    runs-on: ubuntu-latest
    steps:
      - name: Check out site
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install metadata parser
        run: python -m pip install --disable-pip-version-check 'PyYAML==6.0.2'
      - name: Check manga cover matching rules
        run: python -m unittest discover -s tests -p 'test_current_manga_artwork.py'
      - name: Fetch artwork for Currently Experiencing
        env:
          TMDB_API_TOKEN: ${{ secrets.TMDB_API_TOKEN }}
          RAWG_API_KEY: ${{ secrets.RAWG_API_KEY }}
        run: python scripts/import_current_artwork.py
      - name: Save covers to the website
        run: |
          git add -- src/content/pages/home.md public/images/currently
          if git diff --staged --quiet; then
            echo "Artwork already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Automatically update Currently Experiencing artwork"
          git pull --rebase origin main
          git push origin HEAD:main
